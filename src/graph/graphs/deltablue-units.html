const D = {"benchmark":"deltablue","source":["# Copyright (c) Facebook, Inc. and its affiliates. (http://www.facebook.com)","\"\"\"","main.py","============","","Ported for the PyPy project.","Contributed by Daniel Lindsley","","This implementation of the DeltaBlue benchmark was directly ported","from the `V8's source code`_, which was in turn derived","from the Smalltalk implementation by John Maloney and Mario","Wolczko. The original Javascript implementation was licensed under the GPL.","","It's been updated in places to be more idiomatic to Python (for loops over","collections, a couple magic methods, ``OrderedCollection`` being a list & things","altering those collections changed to the builtin methods) but largely retains","the layout & logic from the original. (Ugh.)","",".. _`V8's source code`: (https://github.com/v8/v8/blob/master/benchmarks/deltablue.js)","\"\"\"","from __future__ import annotations","","import __static__","import time","from enum import IntEnum","","from __static__ import CheckedList, box, cast, cbool, clen, int64, inline","from typing import final","import time","","import cinderx.jit","cinderx.jit.compile_after_n_calls(0)","","","@inline","def stronger(s1: Strength, s2: Strength) -> cbool:","    return s1.strength \u003c s2.strength","","","@inline","def weaker(s1: Strength, s2: Strength) -> cbool:","    return s1.strength > s2.strength","","","@inline","def weakest_of(s1: Strength, s2: Strength) -> Strength:","    return s1 if s1.strength > s2.strength else s2","","","@final","class Strength:","    def __init__(self, strength: int64, name: str) -> None:","        self.strength: int64 = strength","        self.name: str = name","","    def next_weaker(self) -> Strength:","        return STRENGTHS[self.strength]","","","# This is a terrible pattern IMO, but true to the original JS implementation.","REQUIRED: Strength = Strength(0, \"required\")","STRONG_PREFERRED: Strength = Strength(1, \"strongPreferred\")","PREFERRED: Strength = Strength(2, \"preferred\")","STRONG_DEFAULT: Strength = Strength(3, \"strongDefault\")","NORMAL: Strength = Strength(4, \"normal\")","WEAK_DEFAULT: Strength = Strength(5, \"weakDefault\")","WEAKEST: Strength = Strength(6, \"weakest\")","","STRENGTHS: CheckedList[Strength] = CheckedList[Strength]([","    WEAKEST,","    WEAK_DEFAULT,","    NORMAL,","    STRONG_DEFAULT,","    PREFERRED,","    # TODO: This looks like a bug in the original code. Shouldn't this be","    #       ``STRONG_PREFERRED? Keeping for porting sake...","    REQUIRED,","])","","","class Constraint(object):","","    def __init__(self, strength: Strength) -> None:","        self.strength: Strength = strength","","    def add_constraint(self) -> None:","        planner: Planner = get_planner()","        self.add_to_graph()","        planner.incremental_add(self)","","    def satisfy(self, mark: int64) -> Constraint | None:","        planner: Planner = get_planner()","        self.choose_method(mark)","","        if not self.is_satisfied():","            if self.strength == REQUIRED:","                print('Could not satisfy a required constraint!')","","            return None","","        self.mark_inputs(mark)","        out: Variable = self.output()","        overridden = out.determined_by","","        if overridden is not None:","            overridden.mark_unsatisfied()","","        out.determined_by = self","","        if not planner.add_propagate(self, mark):","            print('Cycle encountered')","","        out.mark = mark","        return overridden","","    def destroy_constraint(self) -> None:","        planner: Planner = get_planner()","        if self.is_satisfied():","            planner.incremental_remove(self)","        else:","            self.remove_from_graph()","","    def is_input(self) -> cbool:","        return False","","    def mark_inputs(self, mark: int64) -> None:","        pass","","    def inputs_known(self, mark: int64) -> cbool:","        return True","","    def choose_me Variable = self.output()","        out.walk_strength = weakest_of(self.strength, ihn.walk_strength)","        out.stay = ihn.stay","","        if out.stay:","            self.execute()","","    def mark_unsatisfied(self) -> None:","        self.direction = Direction.NONE","","    def inputs_known(self, mark: int64) -> cbool:","        i: Variable = self.input()","        return i.mark == mark or i.stay or cbool(i.determined_by is None)","","    def remove_from_graph(self):","        if self.v1 is not None:","            self.v1.remove_constraint(self)","","        if self.v2 is not None:","            self.v2.remove_constraint(self)","","        self.direction = Direction.NONE","","","@final","class ScaleConstraint(BinaryConstraint):","","    def __init__(self, src: Variable, scale: Variable, offset: Variable, dest: Variable, strength: Strength) -> None:","        self.direction: Direction = Direction.NONE","        self.scale: Variable = scale","        self.offset: Variable = offset","        BinaryConstraint.__init__(self, src, dest, strength)","","    def add_to_graph(self) -> None:","        BinaryConstraint.add_to_graph(self)","        self.scale.add_constraint(self)","        self.offset.add_constraint(self)","","    def remove_from_graph(self):","        BinaryConstraint.remove_from_graph(self)","","        if self.scale is not None:","            self.scale.remove_constraint(self)","","        if self.offset is not None:","            self.offset.remove_constraint(self)","","    def mark_inputs(self, mark: int64) -> None:","        BinaryConstraint.mark_inputs(self, mark)","        self.scale.mark = mark","        self.offset.mark = mark","","    def execute(self) -> None:","        if self.direction == Direction.FORWARD:","            self.v2.value = self.v1.value * self.scale.value + self.offset.value","        else:","            self.v1.value = (","                                    self.v2.value - self.offset.value) / self.scale.value","","    def recalculate(self) -> None:","        ihn: Variable = self.input()","        out: Variable = self.output()","        out.walk_strength = weakest_of(self.strength, ihn.walk_strength)","        out.stay = ihn.stay and self.scale.stay and self.offset.stay","","        if out.stay:","            self.execute()","","","@final","class EqualityConstraint(BinaryConstraint):","","    def execute(self) -> None:","        self.output().value = self.input().value","","","@final","class Variable(object):","","    def __init__(self, name: str, initial_value: int64 = 0) -> None:","        self.name: str = name","        self.value: int64 = initial_value","        self.constraints: CheckedList[Constraint] = []","        self.determined_by: Constraint | None = None","        self.mark: int64 = 0","        self.walk_strength: Strength = WEAKEST","        self.stay: cbool = True","","    def add_constraint(self, constraint: Constraint) -> None:","        self.constraints.append(constraint)","","    def remove_constraint(self, constraint: Constraint) -> None:","        self.constraints.remove(constraint)","","        if self.determined_by == constraint:","            self.determined_by = None","","","@final","class Planner(object):","","    def __init__(self) -> None:","        self.current_mark: int64 = 0","","    def incremental_add(self, constraint: Constraint) -> None:","        mark: int64 = self.new_mark()","        overridden: Constraint | None = constraint.satisfy(mark)","","        while overridden is not None:","            overridden = overridden.satisfy(mark)","","    def incremental_remove(self, constraint: Constraint) -> None:","        out: Variable = constraint.output()","        constraint.mark_unsatisfied()","        constraint.remove_from_graph()","        unsatisfied = self.remove_propagate_from(out)","        strength = REQUIRED","        # Do-while, the Python way.","        repeat = True","","        while repeat:","            for u in unsatisfied:"," "    constraint and values must propagate down the entire length of the","    chain. In case 2, the added constraint is weaker than the stay","    constraint so it cannot be accomodated. The cost in this case is,","    of course, very low. Typical situations lie somewhere between these","    two extremes.","    \"\"\"","    planner: Planner = recreate_planner()","    prev: Variable | None = None","    first: Variable | None = None","    last: Variable | None = None","","    # We need to go up to n inclusively.","    i: int64 = 0","    end: int64 = n + 1","    while i \u003c n + 1:","        name = \"v%s\" % box(i)","        v: Variable = Variable(name)","","        if prev is not None:","            EqualityConstraint(prev, v, REQUIRED)","","        if i == 0:","            first = v","","        if i == n:","            last = v","","        prev = v","","        i = i + 1","","    first = cast(Variable, first)","    last = cast(Variable, last)","","    StayConstraint(last, STRONG_DEFAULT)","    edit: EditConstraint = EditConstraint(first, PREFERRED)","    edits: CheckedList[UrnaryConstraint] = []","    edits.append(edit)","    plan: Plan = planner.extract_plan_from_constraints(edits)","","    i = 0","    while i \u003c 100:","        first.value = i","        plan.execute()","","        if last.value != i:","            print(\"Chain test failed.\")","","        i = i + 1","","","def projection_test(n: int64) -> None:","    \"\"\"","    This test constructs a two sets of variables related to each","    other by a simple linear transformation (scale and offset). The","    time is measured to change a variable on either side of the","    mapping and to change the scale and offset factors.","    \"\"\"","    planner: Planner = recreate_planner()","    scale: Variable = Variable(\"scale\", 10)","    offset: Variable = Variable(\"offset\", 1000)","    src: Variable | None = None","","    dests: CheckedList[Variable] = []","","    i: int64 = 0","    dst = Variable(\"dst ncells.textContent = D.cells;
nedges.textContent = D.edges;

const maxSize = Math.max(...D.units.map(u => u.members.length));
const maxReach = Math.max(...D.units.map(u => u.reach));

const src = document.getElementById("src");
D.source.forEach((text, i) => {
  const row = document.createElement("div");
  row.className = "row"; row.dataset.line = i + 1;
  row.innerHTML = '<div class="no"></div><div class="rail"></div><div class="code"></div>';
  row.children[0].textContent = i + 1;
  row.children[2].textContent = text || " ";
  src.append(row);
});

const list = document.getElementById("units");
D.units.forEach(u => {
  const b = document.createElement("button");
  b.className = "unit"; b.type = "button";
  const first = u.members[0];
  b.innerHTML = '<span class="idx"></span><span><span class="head"></span>'
              + '<span class="meta"></span></span>'
              + '<span class="bars"><i class="bar size"></i><i class="bar reach"></i></span>';
  b.querySelector(".idx").textContent = "#" + u.index;
  b.querySelector(".head").textContent = first.text;
  b.querySelector(".meta").textContent =
      u.members.length + (u.members.length === 1 ? " annotation" : " annotations")
      + " \u00b7 lines " + u.first + "\u2013" + u.last
      + " \u00b7 reaches " + u.reach;
  b.querySelector(".bar.size").style.width = (10 + 54 * u.members.length / maxSize) + "px";
  b.querySelector(".bar.reach").style.width = (10 + 54 * u.reach / maxReach) + "px";
  b.onclick = () => select(u, b);
  list.append(b);
});

function select(unit, button) {
  document.querySelectorAll(".unit[aria-current]").forEach(e => e.removeAttribute("aria-current"));
  button.setAttribute("aria-current", "true");
  const hit = new Set(unit.members.map(m => m.line));
  document.querySelectorAll(".row").forEach(row => {
    const n = +row.dataset.line;
    row.classList.toggle("hit", hit.has(n));
    row.classList.toggle("span", !hit.has(n) && n > unit.first && n < unit.last);
  });
  const target = src.querySelector('.row[data-line="' + unit.first + '"]');
  if (target) target.scrollIntoView({block:"center", behavior:
    matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
select(D.units[0], list.firstElementChild);
