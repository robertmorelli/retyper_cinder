 example: create_array(2,7,2) -> (2,4,6) ; create_array(1,4,1)->(1,2,3)", "    \"\"\"", "    c: int64 = start", "    i: int64 = 0", "    if (end - start) * step \u003c= 0:", "        return Array[int64](0)", "    size: int64 = int64((static_abs(end - start) - 1) // static_abs(step) + 1)", "    a: Array[int64] = Array[int64](box(size))", "    while i \u003c size:", "        a[i] = c", "        c = c + step", "        i = i + 1", "    return a", "", "", "def permutations(pool: Array[int64], r: int64 = -1) -> Iterator[Array[int64]]:", "    n: int64 = clen(pool)", "    if r == -1:", "        r = n", "    rb: int = box(r)", "    indices: Array[int64] = create_array(0, n, 1)", "    cycles: Array[int64] = create_array(n, n - r, -1)", "    per: Array[int64] = Array[int64](rb)", "    idx: int64 = 0", "    while idx \u003c r:", "        per[idx] = pool[indices[idx]]", "        idx += 1", "", "    yield per", "    while n:", "        i: int = rb - 1", "        while i >= 0:", "            cycles[i] -= 1", "            if cycles[i] == 0:", "                # rotate # indices[i:] = Array[int64](indices[i + 1 :] + indices[i : i + 1])", "                lastN: int64 = indices[i]", "                for ii in range(i + 1, len(indices)):", "                    indices[ii - 1] = indices[ii]", "                indices[len(indices) - 1] = lastN", "                cycles[i] = n - int64(i)", "            else:", "                j: int64 = cycles[i]", "                tmp: int64 = indices[-j]", "                indices[-j] = indices[i]", "                indices[i] = tmp", "                idx = 0", "                while idx \u003c r:", "                    per[idx] = pool[indices[idx]]", "                    idx += 1", "                yield per", "                break", "            i -= 1", "        if i == -1:", "            return", "", "", "def solve(queen_count: int) -> Iterator[Array[int64]]:", "    \"\"\"N-Queens solver.", "", "    Args:", "        queen_count: the number of queens to solve for. This is also the", "            board size.", "", "    Yields:", "        Solutions to the problem. Each yielded value is looks like", "        (3, 8, 2, 1, 4, ..., 6) where each number is the column position for the", "        queen, and the index into the tuple indicates the row.", "    \"\"\"", "", "    # The generator is still needed as it is being used to check if it is a valid configuration using sets", "    cols: Iterator[int] = range(queen_count)", "    static_cols: Array[int64] = create_array(0, int64(queen_count), 1)", "    for vec in permutations(static_cols):", "        if (", "                queen_count", "                == len(set(vec[i] + i for i in cols))  # noqa: C401", "                == len(set(vec[i] - i for i in cols))  # noqa: C401", "        ):", "            yield vec", "", "", "def bench_n_queens(queen_count: int) -> List[Array[int64]]:", "    \"\"\"", "    Return all the possible valid configurations of the queens", "    in a board of size queen_count.", "    See solve method to understand it better", "    \"\"\"", "    return list(solve(queen_count))", "", "", "if __name__ == \"__main__\":", "    import sys", "", "    num_iterations = 1", "    if len(sys.argv) > 1:", "        num_iterations = int(sys.argv[1])", "", "    queen_count: int = 8", "    startTime = time.time()", "    for _ in range(num_iterations):", "        res: list = bench_n_queens(queen_count)  ## main fun call?", "", "    endTime = time.time()", "    runtime = endTime - startTime", "    print(runtime)", "", "    # assert len(res) == 92"]},source=document.querySelector('#source'),edges=document.querySelector('#edges'),cells=document.querySelector('#cells'),info=document.querySelector('#info'),NS='http://www.w3.org/2000/svg',byId=new Map(data.nodes.map(n=>[n.id,n]));
for(const slot of ['type','context']){const lines=new Map;for(const n of data.nodes.filter(n=>n.slot===slot)){if(!lines.has(n.line))lines.set(n.line,[]);lines.get(n.line).push(n)}for(const group of lines.values()){const ends=[];group.sort((a,b)=>a.col-b.col||b.endcol-a.endcol);for(const n of group){const end=n.endline===n.line?n.endcol:Infinity;let lane=ends.findIndex(value=>n.col>=value);if(lane<0)lane=ends.length;n.lane=lane;ends[lane]=end}}}

function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}function position(n){const row=document.querySelector(`.line[data-line="${n.line}"]`),body=row.querySelector('.text'),r=body.getBoundingClientRect(),style=getComputedStyle(body),probe=document.createElement('canvas').getContext('2d');probe.font=style.font;const w=probe.measureText('M').width,x1=r.left+n.col*w,x2=r.left+Math.max(n.col+1,n.endline===n.line?n.endcol:n.col+1)*w;const center=(r.top+r.bottom)/2,gap=7*(n.lane||0);return{x:(x1+x2)/2,x1,x2,y:n.slot==='type'?center+15+gap:center-15-gap}}
function draw(){edges.replaceChildren();cells.replaceChildren();const pos=new Map(data.nodes.map(n=>[n.id,position(n)]));for(const [i,e] of data.edges.entries()){const a=pos.get(e[0]),b=pos.get(e[1]),dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,end=b,bend=Math.max(24,Math.min(100,len/3)),sign=dx<0?-1:1;const mid={x:(a.x+end.x)/2,y:(a.y+end.y)/2},path=el('path',{d:`M${a.x},${a.y} Q${a.x+bend*sign},${a.y} ${mid.x},${mid.y} Q${end.x-bend*sign},${end.y} ${end.x},${end.y}`,class:'edge','data-edge':i});edges.append(path)}for(const n of data.nodes){const p=pos.get(n.id),line=el('line',{x1:p.x1,y1:p.y,x2:p.x2,y2:p.y,class:`cell ${n.slot}`,'data-id':n.id});line.onclick=()=>select(n);cells.append(line)}}
function select(n){document.body.classList.add('selected');document.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));document.querySelector(`.line[data-line="${n.line}"]`)?.classList.add('hot');for(const [i,e] of data.edges.entries())if(e.includes(n.id))document.querySelector(`[data-edge="${i}"]`)?.classList.add('hot');info.textContent=n.label+'\nvalue: '+(n.values.join(' | ')||'∅')+'\nblue = produced type, orange = demanded context'}source.onscroll=draw;onresize=draw;requestAnimationFrame(draw);</script>
