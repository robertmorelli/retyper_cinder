elf.  I have corrected this", "                by zapping NextRecord.PtrComp at the end of Proc1().", "", "                Second, Proc3() used the operator != to compare a", "                record to None.  This is rather inefficient and not", "                true to the intention of the original benchmark (where", "                a pointer comparison to None is intended; the !=", "                operator attempts to find a method __cmp__ to do value", "                comparison of the record).  Version 1.1 runs 5-10", "                percent faster than version 1.0, so benchmark figures", "                of different versions can't be compared directly.", "", "                Version 1.2 changes the division to floor division.", "", "                Under Python 3 version 1.1 would use the normal division", "                operator, resulting in some of the operations mistakenly", "                yielding floats. Version 1.2 instead uses floor division", "                making the benchmark an integer benchmark again.", "", "    TODO: Predict check for Dict type", "    TODO: Turn int into int64 where we can", "\"\"\"", "from __future__ import annotations", "import __static__", "from __static__ import CheckedList", "from typing import Final", "import time", "", "import cinderx.jit", "cinderx.jit.compile_after_n_calls(0)", "", "LOOPS: Final[int] = 50000", "", "", "__version__: str = \"1.2\"", "", "", "Ident1: Final[int] = 1", "Ident2: Final[int] = 2", "Ident3: Final[int] = 3", "Ident4: Final[int] = 4", "Ident5: Final[int] = 5", "", "", "class Record:", "    def __init__(", "        self,", "        PtrComp: Record | None = None,", "        Discr: int = 0,", "        EnumComp: int = 0,", "        IntComp: int = 0,", "        StringComp: str = \"\\0\",", "    ):", "        self.PtrComp: Record | None = PtrComp", "        self.Discr: int = Discr", "        self.EnumComp: int = EnumComp", "        self.IntComp: int = IntComp", "        self.StringComp: str = StringComp", "", "    def copy(self):", "        return Record(", "            self.PtrComp, self.Discr, self.EnumComp, self.IntComp, self.StringComp", "        )", "", "", "TRUE: Final[bool] = True", "FALSE: Final[bool] = False", "", "", "def pystones(loops=LOOPS):", "    Proc0(loops)", "", "", "IntGlob: int = 0", "BoolGlob: bool = FALSE", "Char1Glob: str = \"\\0\"", "Char2Glob: str = \"\\0\"", "Array1Glob: CheckedList[int] = CheckedList[int]([0] * 51)", "Array2Glob: CheckedList[CheckedList[int]] = CheckedList[CheckedList[int]]([CheckedList[int](x) for x in [Array1Glob] * 51])", "PtrGlb: Record | None = None", "PtrGlbNext: Record | None = None", "", "", "def Proc0(loops=LOOPS):", "    global IntGlob", "    global BoolGlob", "    global Char1Glob", "    global Char2Glob", "    global Array1Glob", "    global Array2Glob", "    global PtrGlb", "    global PtrGlbNext", "", "    for _i in range(loops):", "        pass", "", "    PtrGlbNext = Record()", "    PtrGlb = Record()", "    local_PtrGlb = PtrGlb", "    assert local_PtrGlb is not None", "    local_PtrGlb.PtrComp = PtrGlbNext", "    local_PtrGlb.Discr = Ident1", "    local_PtrGlb.EnumComp = Ident3", "    local_PtrGlb.IntComp = 40", "    local_PtrGlb.StringComp = \"DHRYSTONE PROGRAM, SOME STRING\"", "    String1Loc: str = \"DHRYSTONE PROGRAM, 1'ST STRING\"", "    Array2Glob[8][7] = 10", "", "    for _i in range(loops):", "        Proc5()", "        Proc4()", "        IntLoc1: int = 2", "        IntLoc2: int = 3", "        String2Loc: str = \"DHRYSTONE PROGRAM, 2'ND STRING\"", "        EnumLoc: int = Ident2", "        BoolGlob = not Func2(String1Loc, String2Loc)", "        IntLoc3: int = 0", "        while IntLoc1 \u003c IntLoc2:", "            IntLoc3 = 5 * IntLoc1 - IntLoc2", "            IntLoc3 = Proc7(IntLoc1, IntLoc2)", "            IntLoc1 = IntLoc1 + 1", "        Proc8(Array1Glob, Array2Glob, IntLoc1, IntLoc3)", "        PtrGlb = Proc1(local_PtrGlb)", "        local_PtrGlb = PtrGlb", "        assert local_PtrGlb is not None", "        CharIndex: str = \"A\"", "        while CharIndex \u003c= Char2Glob:", "            if EnumLoc == Func1(CharIndex, \"C\"):", "                EnumLoc = Proc6(Ident1)", "            CharIndex = chr(ord(CharIndex) + 1)", "        IntLoc3 = IntLoc2 * IntLoc1", "        IntLoc2 = IntLoc3 // IntLoc1", "        IntLoc2 = 7 * (IntLoc3 - IntLoc2) - IntLoc1", "        IntLoc1 = Proc2(IntLoc1)", "", "", "def Proc1(PtrParIn: Record) -> Record:", "    local_PtrGlb = PtrGlb", "    assert local_PtrGlb is not None", "    PtrParIn.PtrComp = NextRecord = local_PtrGlb.copy()", "    PtrParIn.IntComp = 5", "    NextRecord.IntComp = PtrParIn.IntComp", "    NextRecord.PtrComp = PtrParIn.PtrComp", "    NextRecord.PtrComp = Proc3(NextRecord.PtrComp)", "    if NextRecord.Discr == Ident1:", "        NextRecord.IntComp = 6", "        NextRecord.EnumComp = Proc6(PtrParIn.EnumComp)", "        NextRecord.PtrComp = local_PtrGlb.PtrComp", "        NextRecord.IntComp = Proc7(NextRecord.IntComp, 10)", "    else:", "        PtrParIn = NextRecord.copy()", "    NextRecord.PtrComp = None", "    return PtrParIn", "", "", "def Proc2(IntParIO: int) -> int:", "    IntLoc: int = IntParIO + 10", "    EnumLoc: int = 0", "    while 1:", "        if Char1Glob == \"A\":", "            IntLoc = IntLoc - 1", "            IntParIO = IntLoc - IntGlob", "            EnumLoc = Ident1", "        if EnumLoc == Ident1:", "            break", "    return IntParIO", "", "", "def Proc3(PtrParOut: Record | None) -> Record | None:", "    global IntGlob", "    global PtrGlb", "    local_PtrGlb = PtrGlb", "    assert local_PtrGlb is not None", "    ## This validation seems to be unnecessary. If PtrGlb is None then the assignemt local_PtrGlb.IntComp would raise an error", "    if local_PtrGlb is not None:", "        PtrParOut = local_PtrGlb.PtrComp", "    else:", "        IntGlob = 100", "    local_PtrGlb.IntComp = Proc7(10, IntGlob)", "    PtrGlb = local_PtrGlb", "    return PtrParOut", "", "", "def Proc4() -> None:", "    global Char2Glob", "", "    BoolLoc: bool = Char1Glob == \"A\"", "    BoolLoc = BoolLoc or BoolGlob", "    Char2Glob = \"B\"", "", "", "def Proc5() -> None:", "    global Char1Glob", "    global BoolGlob", "", "    Char1Glob = \"A\"", "    BoolGlob = FALSE", "", "", "def Proc6(EnumParIn: int) -> int:", "    EnumParOut: int = EnumParIn", "    if not Func3(EnumParIn):", "        EnumParOut = Ident4", "    if EnumParIn == Ident1:", "        EnumParOut = Ident1", "    elif EnumParIn == Ident2:", "        if IntGlob > 100:", "            EnumParOut = Ident1", "        else:", "            EnumParOut = Ident4", "    elif EnumParIn == Ident3:", "        EnumParOut = Ident2", "    elif EnumParIn == Ident4:", "        pass", "    elif EnumParIn == Ident5:", "        EnumParOut = Ident3", "    return EnumParOut", "", "", "def Proc7(IntParI1: int, IntParI2: int) -> int:", "    IntLoc: int = IntParI1 + 2", "    IntParOut: int = IntParI2 + IntLoc", "    return IntParOut", "", "", "def Proc8(", "    Array1Par: CheckedList[int], Array2Par: CheckedList[CheckedList[int]], IntParI1: int, IntParI2: int", ") -> None:", "    global IntGlob", "    IntLoc = IntParI1 + 5", "    Array1Par[IntLoc] = IntParI2", "    Array1Par[IntLoc + 1] = Array1Par[IntLoc]", "    Array1Par[IntLoc + 30] = IntLoc", "    for IntIndex in range(IntLoc, IntLoc + 2):", "        Array2Par[IntLoc][IntIndex] = IntLoc", "    Array2Par[IntLoc][IntLoc - 1] = Array2Par[IntLoc][IntLoc - 1] + 1", "    Array2Par[IntLoc + 20][IntLoc] = Array1Par[IntLoc]", "    IntGlob = 5", "", "", "def Func1(CharPar1: str, CharPar2: str) -> int:", "    CharLoc1: str = CharPar1", "    CharLoc2: str = CharLoc1", "    if CharLoc2 != CharPar2:", "        return Ident1", "    else:", "        return Ident2", "", "", "def Func2(StrParI1: str, StrParI2: str) -> bool:", "    IntLoc: int = 1", "    CharLoc: str = \"\"", "    while IntLoc \u003c= 1:", "        if Func1(StrParI1[IntLoc], StrParI2[IntLoc + 1]) == Ident1:", "            CharLoc = \"A\"", "            IntLoc = IntLoc + 1", "    if CharLoc >= \"W\" and CharLoc \u003c= \"Z\":", "        IntLoc = 7", "    if CharLoc == \"X\":", "        return TRUE", "    else:", "        if StrParI1 > StrParI2:", "            IntLoc = IntLoc + 7", "            return TRUE", "        else:", "            return FALSE", "", "", "def Func3(EnumParIn: int) -> bool:", "    EnumLoc: int = EnumParIn", "    if EnumLoc == Ident3:", "        return TRUE", "    return FALSE", "", "", "def run() -> None:", "    loops: int = LOOPS", "    pystones(loops)", "", "if __name__ == \"__main__\":", "    import sys", "", "    num_iterations = 2", "    if len(sys.argv) > 1:", "        num_iterations = int(sys.argv[1])", "", "    startTime = time.time()", "", "    for _ in range(num_iterations):", "        run()", "", "    endTime = time.time()", "    runtime = endTime - startTime", "    print(runtime)", ""]},source=document.querySelector('#source'),edges=document.querySelector('#edges'),cells=document.querySelector('#cells'),info=document.querySelector('#info'),NS='http://www.w3.org/2000/svg',byId=new Map(data.nodes.map(n=>[n.id,n]));
for(const slot of ['type','context']){const lines=new Map;for(const n of data.nodes.filter(n=>n.slot===slot)){if(!lines.has(n.line))lines.set(n.line,[]);lines.get(n.line).push(n)}for(const group of lines.values()){const ends=[];group.sort((a,b)=>a.col-b.col||b.endcol-a.endcol);for(const n of group){const end=n.endline===n.line?n.endcol:Infinity;let lane=ends.findIndex(value=>n.col>=value);if(lane<0)lane=ends.length;n.lane=lane;ends[lane]=end}}}
data.source.forEach((text,i)=>{const row=document.createElement('span');row.className='line';row.dataset.line=i+1;const no=document.createElement('span');no.className='no';no.textContent=i+1;const body=document.createElement('span');body.className='text';body.textContent=text||' ';row.append(no,body);source.append(row)});
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}function position(n){const row=document.querySelector(`.line[data-line="${n.line}"]`),body=row.querySelector('.text'),r=body.getBoundingClientRect(),style=getComputedStyle(body),probe=document.createElement('canvas').getContext('2d');probe.font=style.font;const w=probe.measureText('M').width,x1=r.left+n.col*w,x2=r.left+Math.max(n.col+1,n.endline===n.line?n.endcol:n.col+1)*w;const center=(r.top+r.bottom)/2,gap=7*(n.lane||0);return{x:(x1+x2)/2,x1,x2,y:n.slot==='type'?center+15+gap:center-15-gap}}
function draw(){edges.replaceChildren();cells.replaceChildren();const pos=new Map(data.nodes.map(n=>[n.id,position(n)]));for(const [i,e] of data.edges.entries()){const a=pos.get(e[0]),b=pos.get(e[1]),dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,end=b,bend=Math.max(24,Math.min(100,len/3)),sign=dx<0?-1:1;const mid={x:(a.x+end.x)/2,y:(a.y+end.y)/2},path=el('path',{d:`M${a.x},${a.y} Q${a.x+bend*sign},${a.y} ${mid.x},${mid.y} Q${end.x-bend*sign},${end.y} ${end.x},${end.y}`,class:'edge','data-edge':i});edges.append(path)}for(const n of data.nodes){const p=pos.get(n.id),line=el('line',{x1:p.x1,y1:p.y,x2:p.x2,y2:p.y,class:`cell ${n.slot}`,'data-id':n.id});line.onclick=()=>select(n);cells.append(line)}}
function select(n){document.body.classList.add('selected');document.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));document.querySelector(`.line[data-line="${n.line}"]`)?.classList.add('hot');for(const [i,e] of data.edges.entries())if(e.includes(n.id))document.querySelector(`[data-edge="${i}"]`)?.classList.add('hot');info.textContent=n.label+'\nvalue: '+(n.values.join(' | ')||'∅')+'\nblue = produced type, orange = demanded context'}source.onscroll=draw;onresize=draw;requestAnimationFrame(draw);</script>
