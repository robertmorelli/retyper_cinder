], [18, 232], [924, 926], [1490, 1487], [18, 17], [1330, 1338], [1028, 1029], [845, 847], [699, 703], [564, 560], [56, 55], [602, 601], [1338, 1327], [1451, 1450], [528, 527], [548, 547], [151, 159], [390, 391], [1228, 1229], [1029, 1031], [723, 997], [170, 171], [475, 536], [62, 61], [427, 428], [1103, 1104], [1293, 1288], [554, 557], [787, 777], [259, 262], [362, 366], [527, 550], [902, 901], [92, 89], [926, 925], [404, 417], [1285, 1284], [399, 466], [1431, 1428], [739, 737], [19, 20], [276, 318]], "source": ["#   Copyright (C) 2005 Carl Friedrich Bolz", "\"\"\"create chaosgame-like fractals", "", "bg:", "- removed `timer` argument, using Timer class instead", "- changed `times` return value (returning Void instead of List(Dyn) ... hmm)", "- params made mandatory:", "  - `GVector.__init__`, all arguments", "  - `GVector.linear_combination` `l2`", "  - `Spline.__init__`, `degree` and `knots`", "- params removed removed:", "  - `Chaosgame.transform_point` optional argument `trafo`, was always None", "- inlined main function", "- replace `reduce(operator.add, self.num_trafos, 0)` with `sum(self.num_trafos)`", "- add `ITERATIONS` constant", "- replace `xrange` with `range`", "- remove unused imports", "- CONTROVERSIAL:", "  - inlined GetIndex", "  - inlined truncate", "  - inlined create_image_chaos", "  - inlined GetKnots", "\"\"\"", "from __future__ import annotations", "import __static__", "from typing import List", "from __static__ import CheckedList", "import random", "import time", "random.seed(1234)", "ITERATIONS: int = 1", "import math", "", "import cinderx.jit", "cinderx.jit.compile_after_n_calls(0)", "", "class GVector(object):", "    def __init__(self, x: float, y: float, z: float) -> None:", "        self.x: float = x", "        self.y: float = y", "        self.z: float = z", "", "    def Mag(self) -> float:", "        return math.sqrt(self.x ** 2 + self.y ** 2 + self.z ** 2)", "", "    def dist(self, other: GVector) -> float:", "        return math.sqrt((self.x - other.x) ** 2 +", "                         (self.y - other.y) ** 2 +", "                         (self.z - other.z) ** 2)", "", "    def __add__(self, other: GVector) -> GVector:", "        if not isinstance(other, GVector):", "            raise ValueError(\"Can't add GVector to \" + str(type(other)))", "        v: GVector = GVector(self.x + other.x, self.y + other.y, self.z + other.z)", "        return v", "", "    def __sub__(self, other: GVector) -> GVector:", "        return self + other * -1", "", "    def __mul__(self, other: float) -> GVector:", "        v: GVector = GVector(self.x * other, self.y * other, self.z * other)", "        return v", "", "    __rmul__ = __mul__", "", "    def linear_combination(self, other: GVector, l1: float, l2: float) -> GVector:", "        v: GVector = GVector(self.x * l1 + other.x * l2,", "                    self.y * l1 + other.y * l2,", "                    self.z * l1 + other.z * l2)", "        return v", "", "class Spline(object):", "    def __init__(self, points: CheckedList[GVector], degree: int, knots: CheckedList[int]) -> None:", "        if knots == None:", "            knots = [0] * degree + range(1, len(points) - degree)", "            knots += CheckedList[int]([len(points) - degree]) * degree", "            self.knots = knots", "        else:", "            if len(points) > len(knots) - degree + 1:", "                raise ValueError(\"too many control points\")", "            elif len(points) \u003c len(knots) - degree + 1:", "                raise ValueError(\"not enough control points\")", "            last = knots[0]", "            for cur in knots[1:]:", "                if cur \u003c last:", "                    raise ValueError(\"knots not strictly increasing\")", "                last = cur", "            self.knots = knots", "        self.points = points", "        self.degree = degree", "", "    def GetDomain(self) -> (int, int):", "        return (self.knots[self.degree - 1],", "                self.knots[len(self.knots) - self.degree])", "", "    def __call__(self, u: float) -> GVector:", "        dom = self.GetDomain()", "        if u \u003c dom[0] or u > dom[1]:", "            raise ValueError(\"Function value not in domain\")", "        if u == dom[0]:", "            return self.points[0]", "        if u == dom[1]:", "            return self.points[-1]", "        I = None", "        GetIndexdom = self.GetDomain()", "        for ii in range(self.degree - 1, len(self.knots) - self.degree):", "            if u >= self.knots[ii] and u \u003c self.knots[ii + 1]:", "                I = ii", "                break", "        else:", "            I = GetIndexdom[1] - 1", "        d: list = [self.points[I - self.degree + 1 + ii]", "             for ii in range(self.degree + 1)]", "        U = self.knots", "        for ik in range(1, self.degree + 1):", "            for ii in range(I - self.degree + ik + 1, I + 2):", "                ua = U[ii + self.degree - ik]", "                ub = U[ii - 1]", "                co1 = (ua - u) / (ua - ub)", "                co2 = (u - ub) / (ua - ub)", "                index = ii - I + self.degree - ik - 1", "                d[index] = d[index].linear_combination(d[index + 1], co1, co2)", "        return d[0]", "", "class Chaosgame(object):", "    def __init__(self, splines: List[Spline], thickness: float, w: int, h: int, n: int) -> None:", "        self.splines : CheckedList[Spline] = CheckedList[Spline](splines)", "        self.thickness = thickness", "        self.minx = min([p.x for spl in splines for p in spl.points])", "        self.miny = min([p.y for spl in splines for p in spl.points])", "        self.maxx = max([p.x for spl in splines for p in spl.points])", "        self.maxy = max([p.y for spl in splines for p in spl.points])", "        self.height = self.maxy - self.miny", "        self.width = self.maxx - self.minx", "        self.num_trafos = []", "        maxlength = thickness * self.width / self.height", "        for spl in splines:", "            length: int = 0", "            curr = spl(0)", "            for i in range(1, 1000):", "                last = curr", "                t = 1 / 999 * i", "                curr = spl(t)", "                length += curr.dist(last)", "            self.num_trafos.append(max(1, int(length / maxlength * 1.5)))", "        self.num_total = sum(self.num_trafos)", "        im: list = [[1] * h for i in range(w)]", "        point = GVector((self.maxx + self.minx) / 2,", "                        (self.maxy + self.miny) / 2,", "                        0)", "        colored: int = 0", "        for _ in range(n):", "            for i in range(5000):", "                point = self.transform_point(point)", "                x = (point.x - self.minx) / self.width * w", "                y = (point.y - self.miny) / self.height * h", "                x = int(x)", "                y = int(y)", "                if x == w:", "                    x -= 1", "                if y == h:", "                    y -= 1", "                im[x][h - y - 1] = 0", "", "", "    def transform_point(self, point: GVector) -> GVector:", "        x = (point.x - self.minx) / self.width", "        y = (point.y - self.miny) / self.height", "        rrr = random.randrange(int(self.num_total) + 1)", "        lll: int = 0", "        for iii in range(len(self.num_trafos)):", "            if rrr >= lll and rrr \u003c lll + self.num_trafos[iii]:", "                trafo = iii, random.randrange(self.num_trafos[iii])", "            lll += self.num_trafos[iii]", "        trafo = len(self.num_trafos) - 1, random.randrange(self.num_trafos[-1])", "        start, end = self.splines[trafo[0]].GetDomain()", "        length = end - start", "        seg_length = length / self.num_trafos[trafo[0]]", "        t = start + seg_length * trafo[1] + seg_length * x", "        basepoint = self.splines[trafo[0]](t)", "        if t + 1 / 50000 > end:", "            neighbour = self.splines[trafo[0]](t - 1 / 50000)", "            derivative = neighbour - basepoint", "        else:", "            neighbour = self.splines[trafo[0]](t + 1 / 50000)", "            derivative = basepoint - neighbour", "        if derivative.Mag() != 0:", "            basepoint.x += derivative.y / derivative.Mag() * (y - 0.5) * \\", "                           self.thickness", "            basepoint.y += -derivative.x / derivative.Mag() * (y - 0.5) * \\", "                           self.thickness", "        else:", "            print(\"r\", end='')", "            # bg: inlined", "            ##self.truncate(basepoint)", "        if basepoint.x >= self.maxx:", "            basepoint.x = self.maxx", "        if basepoint.y >= self.maxy:", "            basepoint.y = self.maxy", "        if basepoint.x \u003c self.minx:", "            basepoint.x = self.minx", "        if basepoint.y \u003c self.miny:", "            basepoint.y = self.miny", "        return basepoint", "", "if __name__ == \"__main__\":", "    splines: list = [", "        Spline([", "            GVector(1.597350, 3.304460, 0.000000),", "            GVector(1.575810, 4.123260, 0.000000),", "            GVector(1.313210, 5.288350, 0.000000),", "            GVector(1.618900, 5.329910, 0.000000),", "            GVector(2.889940, 5.502700, 0.000000),", "            GVector(2.373060, 4.381830, 0.000000),", "            GVector(1.662000, 4.360280, 0.000000)],", "            3, [0, 0, 0, 1, 1, 1, 2, 2, 2]),", "        Spline([", "            GVector(2.804500, 4.017350, 0.000000),", "            GVector(2.550500, 3.525230, 0.000000),", "            GVector(1.979010, 2.620360, 0.000000),", "            GVector(1.979010, 2.620360, 0.000000)],", "            3, [0, 0, 0, 1, 1, 1]),", "        Spline([", "            GVector(2.001670, 4.011320, 0.000000),", "            GVector(2.335040, 3.312830, 0.000000),", "            GVector(2.366800, 3.233460, 0.000000),", "            GVector(2.366800, 3.233460, 0.000000)],", "            3, [0, 0, 0, 1, 1, 1])", "    ]", "    startTime  = time.time()", "    c: Chaosgame = Chaosgame(splines, 0.25, 1000, 1200, ITERATIONS)", "    endTime = time.time()", "    runtime = endTime - startTime", "    print(runtime)"]},source=document.querySelector('#source'),edges=document.querySelector('#edges'),cells=document.querySelector('#cells'),info=document.querySelector('#info'),NS='http://www.w3.org/2000/svg',byId=new Map(data.nodes.map(n=>[n.id,n]));
for(const slot of ['type','context']){const lines=new Map;for(const n of data.nodes.filter(n=>n.slot===slot)){if(!lines.has(n.line))lines.set(n.line,[]);lines.get(n.line).push(n)}for(const group of lines.values()){const ends=[];group.sort((a,b)=>a.col-b.col||b.endcol-a.endcol);for(const n of group){const end=n.endline===n.line?n.endcol:Infinity;let lane=ends.findIndex(value=>n.col>=value);if(lane<0)lane=ends.length;n.lane=lane;ends[lane]=end}}}

function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}function position(n){const row=document.querySelector(`.line[data-line="${n.line}"]`),body=row.querySelector('.text'),r=body.getBoundingClientRect(),style=getComputedStyle(body),probe=document.createElement('canvas').getContext('2d');probe.font=style.font;const w=probe.measureText('M').width,x1=r.left+n.col*w,x2=r.left+Math.max(n.col+1,n.endline===n.line?n.endcol:n.col+1)*w;const center=(r.top+r.bottom)/2,gap=7*(n.lane||0);return{x:(x1+x2)/2,x1,x2,y:n.slot==='type'?center+15+gap:center-15-gap}}
function draw(){edges.replaceChildren();cells.replaceChildren();const pos=new Map(data.nodes.map(n=>[n.id,position(n)]));for(const [i,e] of data.edges.entries()){const a=pos.get(e[0]),b=pos.get(e[1]),dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,end=b,bend=Math.max(24,Math.min(100,len/3)),sign=dx<0?-1:1;const mid={x:(a.x+end.x)/2,y:(a.y+end.y)/2},path=el('path',{d:`M${a.x},${a.y} Q${a.x+bend*sign},${a.y} ${mid.x},${mid.y} Q${end.x-bend*sign},${end.y} ${end.x},${end.y}`,class:'edge','data-edge':i});edges.append(path)}for(const n of data.nodes){const p=pos.get(n.id),line=el('line',{x1:p.x1,y1:p.y,x2:p.x2,y2:p.y,class:`cell ${n.slot}`,'data-id':n.id});line.onclick=()=>select(n);cells.append(line)}}
function select(n){document.body.classList.add('selected');document.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));document.querySelector(`.line[data-line="${n.line}"]`)?.classList.add('hot');for(const [i,e] of data.edges.entries())if(e.includes(n.id))document.querySelector(`[data-edge="${i}"]`)?.classList.add('hot');info.textContent=n.label+'\nvalue: '+(n.values.join(' | ')||'∅')+'\nblue = produced type, orange = demanded context'}source.onscroll=draw;onresize=draw;requestAnimationFrame(draw);</script>
