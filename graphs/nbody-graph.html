"", "import __static__", "from __static__ import double, CheckedList, CheckedDict, box", "import time", "", "import cinderx.jit", "cinderx.jit.compile_after_n_calls(0)", "__contact__: str = \"collinwinter@google.com (Collin Winter)\"", "DEFAULT_ITERATIONS: int = 20000", "DEFAULT_REFERENCE: str = \"sun\"", "", "", "PI: float = 3.14159265358979323", "SOLAR_MASS = 4 * PI * PI", "DAYS_PER_YEAR: float = 365.24", "", "", "class Vector:", "    def __init__(self, x: double, y: double, z: double):", "        self.x: double = x", "        self.y: double = y", "        self.z: double = z", "", "    def __repr__(self):", "        return f\"Vector({box(self.x), box(self.y), box(self.z)})\"", "", "", "class Body:", "    def __init__(self, pos: Vector, v: Vector, mass: double):", "        self.pos: Vector = pos", "        self.v: Vector = v", "        self.mass: double = mass", "", "    def __repr__(self):", "        return f\"Body({self.pos}, {self.v}, {box(self.mass)})\"", "", "def combinations(l: CheckedList[Body]) -> list[tuple[Body,Body]]:", "    \"\"\"Pure-Python implementation of itertools.combinations(l, 2).\"\"\"", "    result: list[tuple[Body,Body]] = []", "    y: Body", "    for x in range(len(l) - 1):", "        ls: CheckedList[Body] = l[x + 1:]", "        for y in ls:", "            result.append((l[x], y))", "    return result", "", "BODIES = CheckedDict[str, Body]({", "    \"sun\": Body(Vector(0.0, 0.0, 0.0), Vector(0.0, 0.0, 0.0), double(SOLAR_MASS)),", "    \"jupiter\": Body(", "        Vector(4.84143144246472090e00, -1.16032004402742839e00, -1.03622044471123109e-01),", "        Vector(", "            1.66007664274403694e-03 * double(DAYS_PER_YEAR),", "            7.69901118419740425e-03 * double(DAYS_PER_YEAR),", "            -6.90460016972063023e-05 * double(DAYS_PER_YEAR),", "        ),", "        9.54791938424326609e-04 * double(SOLAR_MASS),", "    ),", "    \"saturn\": Body(", "        Vector(8.34336671824457987e00, 4.12479856412430479e00, -4.0352341711432138
