= remaining - 1", "        return count", "", "", "class HeldKarpDP:", "    def __init__(self, subset_count: int64, node_count: int64, fill_value: float) -> None:", "        self.node_count: int64 = node_count", "        total_slots: int64 = subset_count * node_count", "        self.values: CheckedList[float] = CheckedList[float]([fill_value] * box(total_slots))", "", "    def offset(self, subset: Set64, city: int64) -> int64:", "        return subset.bits * self.node_count + city", "", "    def get(self, subset: Set64, city: int64) -> float:", "        return self.values[box(self.offset(subset, city))]", "", "    def set(self, subset: Set64, city: int64, value: float) -> None:", "        self.values[box(self.offset(subset, city))] = value", "", "    def transition_cost(", "        self,", "        distances: DistanceMatrix,", "        subset_without_city: Set64,", "        members: CheckedList[int],", "        member_count: int64,", "        city: int64,", "    ) -> float:", "        best: float = INF_WEIGHT", "        index: int64 = 0", "        while index \u003c member_count:", "            previous_city: int64 = int64(members[box(index)])", "            current: float = self.get(subset_without_city, previous_city) + distances.get(previous_city, city)", "            if current \u003c best:", "                best = current", "            index += 1", "        return best", "", "    def initialize_base_cases(self, distances: DistanceMatrix) -> None:", "        start_city: int64 = 0", "        city: int64 = 1", "        while city \u003c self.node_count:", "            subset: Set64 = Set64.from_city(city)", "            self.set(subset, city, distances.get(start_city, city))", "            city += 1", "", "    def solve_subsets_of_size(", "        self,", "        distances: DistanceMatrix,", "        subset_size: int64,", "        scratch: CheckedList[int],", "    ) -> None:", "        subset_limit: int64 = int64(1) \u003c\u003c self.node_count", "        subset: Set64 = Set64.first_of_size(subset_size)", "", "        while subset.bits \u003c subset_limit:", "            member_count: int64 = subset.fill_members(scratch)", "            index: int64 = 0", "            while index \u003c member_count:", "                city: int64 = int64(scratch[box(index)])", "                city_set: Set64 = Set64.from_city(city)", "                subset_without_city: Set64 = subset.remove(city_set)", "                best: float = self.transition_cost(", "                    distances,", "                    subset_without_city,", "                    scratch,", "                    member_count,", "                    city,", "                )", "                self.set(subset, city, best)", "                index += 1", "            subset = subset.next_same_size()", "", "    def close_tour(self, distances: DistanceMatrix) -> float:", "        visited: Set64 = Set64.full_for_node_count(self.node_count)", "        best: float = INF_WEIGHT", "        start_city: int64 = 0", "        city: int64 = 1", "        while city \u003c self.node_count:", "            current: float = self.get(visited, city) + distances.get(city, start_city)", "            if current \u003c best:", "                best = current", "            city += 1", "        return best", "", "", "class DistanceMatrix:", "    def __init__(self, node_count: int64) -> None:", "        self.node_count: int64 = node_count", "        self.values: CheckedList[float] = CheckedList[float]([0.0] * box(node_count * node_count))", "", "    def offset(self, row: int64, column: int64) -> int64:", "        return row * self.node_count + column", "", "    def get(self, row: int64, column: int64) -> float:", "        return self.values[box(self.offset(row, column))]", "", "    def set(self, row: int64, column: int64, value: float) -> None:", "        self.values[box(self.offset(row, column))] = value", "", "    def fill_reference_values(self) -> None:", "        values: Tuple[float, ...] = (", "            0.0, 3.0, 4.0, 2.0, 7.0,", "            3.0, 0.0, 4.0, 6.0, 3.0,", "            4.0, 4.0, 0.0, 5.0, 8.0,", "            2.0, 6.0, 5.0, 0.0, 6.0,", "            7.0, 3.0, 8.0, 6.0, 0.0,", "        )", "        row: int64 = 0", "        while row \u003c self.node_count:", "            column: int64 = 0", "            while column \u003c self.node_count:", "                value: float = values[box(self.offset(row, column))]", "                if row == column:", "                    self.set(row, column, INF_WEIGHT)", "                else:", "                    self.set(row, column, value)", "                column += 1", "            row += 1", "", "", "def fill_random_values(matrix: DistanceMatrix) -> None:", "    row: int64 = 0", "    while row \u003c matrix.node_count:", "        column: int64 = 0", "        while column \u003c matrix.node_count:", "            if row == column:", "                matrix.set(row, column, INF_WEIGHT)", "            else:", "                # Generating a random float representing distance", "                random_dist: float = float(random.uniform(1.0, 100.0))", "                matrix.set(row, column, random_dist)", "            column += 1", "        row += 1", "", "", "def held_karp(node_count: int64, distances: DistanceMatrix) -> float:", "    subset_capacity: int64 = int64(1) \u003c\u003c node_count", "    dp: HeldKarpDP = HeldKarpDP(subset_capacity, node_count, INF_WEIGHT)", "", "    scratch: CheckedList[int] = CheckedList[int]([0] * box(node_count))", "    dp.initialize_base_cases(distances)", "", "    subset_size: int64 = 2", "    while subset_size \u003c node_count:", "        dp.solve_subsets_of_size(distances, subset_size, scratch)", "        subset_size += 1", "", "    return dp.close_tour(distances)", "", "", "def run_reference_case() -> float:", "    node_count: int64 = int64(REFERENCE_NODE_COUNT)", "    distances: DistanceMatrix = DistanceMatrix(node_count)", "    distances.fill_reference_values()", "    return held_karp(node_count, distances)", "", "", "def run_random_benchmark(node_count: int64) -> float:", "    distances: DistanceMatrix = DistanceMatrix(node_count)", "    fill_random_values(distances)", "    return held_karp(node_count, distances)", "", "", "def main() -> None:", "    reference_result: float = run_reference_case()", "    assert int(reference_result) == 19", "    random_node_count: int64 = int64(RANDOM_NODE_COUNT)", "", "    start_time: float = time.time()", "    random_result: float = run_random_benchmark(random_node_count)", "    end_time: float = time.time()", "", "    print(end_time - start_time)", "", "", "if __name__ == \"__main__\":", "    main()"]},source=document.querySelector('#source'),edges=document.querySelector('#edges'),cells=document.querySelector('#cells'),info=document.querySelector('#info'),NS='http://www.w3.org/2000/svg',byId=new Map(data.nodes.map(n=>[n.id,n]));

function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}function position(n){const row=document.querySelector(`.line[data-line="${n.line}"]`),body=row.querySelector('.text'),r=body.getBoundingClientRect(),style=getComputedStyle(body),probe=document.createElement('canvas').getContext('2d');probe.font=style.font;const w=probe.measureText('M').width,x1=r.left+n.col*w,x2=r.left+Math.max(n.col+1,n.endline===n.line?n.endcol:n.col+1)*w;const center=(r.top+r.bottom)/2,gap=7*(n.lane||0);return{x:(x1+x2)/2,x1,x2,y:n.slot==='type'?center+15+gap:center-15-gap}}
function draw(){edges.replaceChildren();cells.replaceChildren();const pos=new Map(data.nodes.map(n=>[n.id,position(n)]));for(const [i,e] of data.edges.entries()){const a=pos.get(e[0]),b=pos.get(e[1]),dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,end=b,bend=Math.max(24,Math.min(100,len/3)),sign=dx<0?-1:1;const mid={x:(a.x+end.x)/2,y:(a.y+end.y)/2},path=el('path',{d:`M${a.x},${a.y} Q${a.x+bend*sign},${a.y} ${mid.x},${mid.y} Q${end.x-bend*sign},${end.y} ${end.x},${end.y}`,class:'edge','data-edge':i});edges.append(path)}for(const n of data.nodes){const p=pos.get(n.id),line=el('line',{x1:p.x1,y1:p.y,x2:p.x2,y2:p.y,class:`cell ${n.slot}`,'data-id':n.id});line.onclick=()=>select(n);cells.append(line)}}
