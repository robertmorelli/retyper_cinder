n 1981 at Cambridge University Computer Laboratory, England", " and a C++ version derived from a Smalltalk version written by", " L Peter Deutsch.", " Java version:  Copyright (C) 1995 Sun Microsystems, Inc.", " Translation from C++, Mario Wolczko", " Outer loop added by Alex Jacoby", "\"\"\"", "", "from __future__ import annotations", "", "import __static__", "import sys", "", "from __static__ import cast, cbool, int64, box, inline", "from typing import Final, Optional, List", "import time", "", "import cinderx.jit", "cinderx.jit.compile_after_n_calls(0)", "# Task IDs", "I_IDLE: Final[int] = 1", "I_WORK: Final[int] = 2", "I_HANDLERA: Final[int] = 3", "I_HANDLERB: Final[int] = 4", "I_DEVA: Final[int] = 5", "I_DEVB: Final[int] = 6", "", "# Packet types", "K_DEV: Final[int] = 1000", "K_WORK: Final[int] = 1001", "", "# Packet", "", "BUFSIZE: Final[int] = 4", "", "BUFSIZE_RANGE: range = range(BUFSIZE)", "", "", "class Packet(object):", "    def __init__(self, l: Optional[Packet], i: int64, k: int64) -> None:", "        self.link: Optional[Packet] = l", "        self.ident: int64 = i", "        self.kind: int64 = k", "        self.datum: int = 0", "        self.data: List[int] = [0] * BUFSIZE", "", "    def append_to(self, lst: Optional[Packet]) -> Packet:", "        self.link = None", "        if lst is None:", "            return self", "        else:", "            p: Packet = lst", "            next: Optional[Packet] = p.link", "            while next is not None:", "                p = next", "                next = p.link", "            p.link = self", "            return lst", "", "", "# Task Records", "", "", "class TaskRec:", "    pass", "", "", "class DeviceTaskRec(TaskRec):", "    def __init__(self) -> None:", "        self.pending: Optional[Packet] = None", "", "", "class IdleTaskRec(TaskRec):", "    def __init__(self) -> None:", "        self.control: int64 = 1", "        self.count: int64 = 10000", "", "", "class HandlerTaskRec(TaskRec):", "    def __init__     def isWaitingWithPacket(self) -> cbool:", "        return self.packet_pending and self.task_waiting and not self.task_holding", "", "", "tracing: bool = False", "layout = 0", "", "", "def trace(a):", "    global layout", "    layout -= 1", "    if layout \u003c= 0:", "        print()", "        layout = 50", "    print(a, end=\"\")", "", "", "TASKTABSIZE: int = 10", "", "", "class TaskWorkArea(object):", "    def __init__(self) -> None:", "        self.taskTab: List[Task] = [None] * TASKTABSIZE", "", "        self.taskList: Optional[Task] = None", "", "        self.holdCount: int64 = 0", "        self.qpktCount: int64 = 0", "", "", "taskWorkArea: TaskWorkArea = TaskWorkArea()", "", "", "class Task(TaskState):", "    def __init__(", "            self,", "            i: int64,", "            p: int64,", "            w: Optional[Packet],", "            initialState: TaskState,", "            r: TaskRec,", "    ) -> None:", "        wa: TaskWorkArea = taskWorkArea", "        self.link: Optional[Task] = wa.taskList", "        self.ident: int64 = i", "        self.priority: int64 = p", "        self.input: Optional[Packet] = w", "", "        self.packet_pending = initialState.isPacketPending()", "        self.task_waiting = initialState.isTaskWaiting()", "        self.task_holding = initialState.isTaskHolding()", "", "        self.handle = r", "", "        wa.taskList = self", "        wa.taskTab[i] = self", "", "    def fn(self, pkt: Optional[Packet], r: TaskRec) -> Optional[Task]:", "        raise NotImplementedError", "", "    def addPacket(self, p: Packet, old: Task) -> Task:", "        if self.input is None:", "            self.input = p", "            self.packet_pending = True", "            if self.priority > old.priority:", "                return self", "        else:", "            p.append_to(self.input)", "        return old", "", "    def runTask(self) -> Optional[Task]:", "        if TaskState.isWaitingWithPacket(self):", "            msg: Optional[Pack
