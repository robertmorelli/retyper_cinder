288], [925, 926], [1600, 1601], [1198, 1602], [107, 105], [940, 1696], [984, 908], [366, 365], [61, 19], [1069, 1065], [748, 747], [1202, 1200], [61, 13], [951, 877], [1139, 1136], [1327, 1326], [352, 353], [1051, 1261], [1315, 1314], [1260, 1254], [1816, 1815], [1169, 1159], [58, 62], [1707, 1704], [106, 107], [974, 829], [1476, 1470], [789, 790], [549, 550], [941, 939], [451, 433], [1657, 1655], [748, 751], [1405, 1441], [393, 415], [1902, 1903], [796, 797], [413, 491], [900, 901], [692, 686], [1363, 1358], [828, 829], [666, 667], [656, 657], [1666, 1789], [39, 907], [1313, 1314], [1628, 1629], [507, 511], [1654, 1656], [1305, 1362], [668, 208], [1487, 1619], [1407, 1405], [978, 653], [1275, 1276], [1229, 1262], [889, 902], [1895, 1913], [662, 658], [305, 297], [1963, 1958], [39, 40], [1221, 1222], [1770, 1769], [1487, 1626], [166, 190], [1382, 1391], [56, 101], [1217, 1214], [1870, 1869], [1598, 1614], [1310, 1307], [1034, 1032], [331, 1187], [1860, 1766], [1448, 1449], [648, 648], [476, 476], [407, 614], [974, 226], [1473, 1474], [1594, 1595], [183, 179], [1189, 1184], [1862, 1776], [630, 619], [397, 398], [545, 546], [492, 493], [88, 85], [458, 459], [1320, 1316], [331, 1274], [1954, 1955], [391, 395], [1110, 1117], [413, 575], [337, 351], [1842, 1847], [1125, 1192], [1290, 1291], [679, 697], [1284, 1293], [784, 785], [978, 977], [1319, 1321], [951, 859], [1925, 1927], [1944, 1963], [1883, 1881], [769, 782], [1888, 1904], [951, 1759], [1436, 1906], [289, 285], [742, 555], [753, 919], [99, 134], [1273, 1274], [573, 569], [100, 101], [141, 343], [1919, 1454], [331, 1258], [1709, 1705], [738, 749], [1237, 1234], [407, 466], [277, 275]], "source": ["# Copyright (c) Facebook, Inc. and its affiliates. (http://www.facebook.com)", "\"\"\"", "main.py", "============", "", "Ported for the PyPy project.", "Contributed by Daniel Lindsley", "", "This implementation of the DeltaBlue benchmark was directly ported", "from the `V8's source code`_, which was in turn derived", "from the Smalltalk implementation by John Maloney and Mario", "Wolczko. The original Javascript implementation was licensed under the GPL.", "", "It's been updated in places to be more idiomatic to Python (for loops over", "collections, a couple magic methods, ``OrderedCollection`` being a list & things", "altering those collections changed to the builtin methods) but largely retains", "the layout & logic from the original. (Ugh.)", "", ".. _`V8's source code`: (https://github.com/v8/v8/blob/master/benchmarks/deltablue.js)", "\"\"\"", "from __future__ import annotations", "", "import __static__", "from enum import IntEnum", "", "from __static__ import CheckedList, box, cast, cbool, clen, int64, inline", "from typing import final", "import time", "", "import cinderx.jit", "cinderx.jit.compile_after_n_calls(0)", "", "", "@inline", "def stronger(s1: Strength, s2: Strength) -> cbool:", "    return s1.strength \u003c s2.strength", "", "", "@inline", "def weaker(s1: Strength, s2: Strength) -> cbool:", "    return s1.strength > s2.strength", "", "", "@inline", "def weakest_of(s1: Strength, s2: Strength) -> Strength:", "    return s1 if s1.strength > s2.strength else s2", "", "", "@final", "class Strength:", "    def __init__(self, strength: int64, name: str) -> None:", "        self.strength: int64 = strength", "        self.name: str = name", "", "    def next_weaker(self) -> Strength:", "        return STRENGTHS[self.strength]", "", "", "# This is a terrible pattern IMO, but true to the original JS implementation.", "REQUIRED: Strength = Strength(0, \"required\")", "STRONG_PREFERRED: Strength = Strength(1, \"strongPreferred\")", "PREFERRED: Strength = Strength(2, \"preferred\")", "STRONG_DEFAULT: Strength = Strength(3, \"strongDefault\")", "NORMAL: Strength = Strength(4, \"normal\")", "WEAK_DEFAULT: Strength = Strength(5, \"weakDefault\")", "WEAKEST: Strength = Strength(6, \"weakest\")", "", "STRENGTHS: CheckedList[Strength] = CheckedList[Strength]([", "    WEAKEST,", "    WEAK_DEFAULT,", "    NORMAL,", "    STRONG_DEFAULT,", "    PREFERRED,", "    # TODO: This looks like a bug in the original code. Shouldn't this be", "    #       ``STRONG_PREFERRED? Keeping for porting sake...", "    REQUIRED,", "])", "", "", "class Constraint(object):", "", "    def __init__(self, strength: Strength) -> None:", "        self.strength: Strength = strength", "", "    def add_constraint(self) -> None:", "        planner: Planner = get_planner()", "        self.add_to_graph()", "        planner.incremental_add(self)", "", "    def satisfy(self, mark: int64) -> Constraint | None:", "        planner: Planner = get_planner()", "        self.choose_method(mark)", "", "        if not self.is_satisfied():", "            if self.strength == REQUIRED:", "                print('Could not satisfy a required constraint!')", "", "            return None", "", "        self.mark_inputs(mark)", "        out: Variable = self.output()", "        overridden = out.determined_by", "", "        if overridden is not None:", "            overridden.mark_unsatisfied()", "", "        out.determined_by = self", "", "        if not planner.add_propagate(self, mark):", "            print('Cycle encountered')", "", "        out.mark = mark", "        return overridden", "", "    def destroy_constraint(self) -> None:", "        planner: Planner = get_planner()", "        if self.is_satisfied():", "            planner.incremental_remove(self)", "        else:", "            self.remove_from_graph()", "", "    def is_input(self) -> cbool:", "        return False", "", "    def mark_inputs(self, mark: int64) -> None:", "        pass", "", "    def inputs_known(self, mark: int64) -> cbool:", "        return True", "", "    def choose_method(self, mark: int64) -> None:", "        pass", "", "    def output(self) -> Variable:", "        raise NotImplementedError()", "", "    def execute(self) -> None:", "        # The methods, THEY DO NOTHING.", "        pass", "", "", "class UrnaryConstraint(Constraint):", "", "    def __init__(self, v: Variable, strength: Strength) -> None:", "        Constraint.__init__(self, strength)", "        self.my_output: Variable = v", "        self.satisfied: cbool = False", "        self.add_constraint()", "", "    def add_to_graph(self) -> None:", "        self.my_output.add_constraint(self)", "        self.satisfied = False", "", "    def choose_method(self, mark: int64) -> None:", "        if self.my_output.mark != mark and \\", "                stronger(self.strength, self.my_output.walk_strength):", "            self.satisfied = True", "        else:", "            self.satisfied = False", "", "    def is_satisfied(self) -> cbool:", "        return self.satisfied", "", "    def output(self) -> Variable:", "        # Ugh. Keeping it for consistency with the original. So much for", "        # \"we're all adults here\"...", "        return self.my_output", "", "    def recalculate(self) -> None:", "        self.my_output.walk_strength = self.strength", "        self.my_output.stay = not self.is_input()", "", "        if self.my_output.stay:", "            self.execute()", "", "    def mark_unsatisfied(self) -> None:", "        self.satisfied = False", "", "    def remove_from_graph(self) -> None:", "        if self.my_output is not None:", "            self.my_output.remove_constraint(self)", "            self.satisfied = False", "", "", "@final", "class StayConstraint(UrnaryConstraint):", "    pass", "", "", "@final", "class EditConstraint(UrnaryConstraint):", "", "    def is_input(self) -> cbool:", "        return True", "", "", "@final", "class Direction(IntEnum):", "    # Hooray for things that ought to be structs!", "    NONE = 0", "    FORWARD = 1", "    BACKWARD = -1", "", "", "class BinaryConstraint(Constraint):", "", "    def __init__(self, v1: Variable, v2: Variable, strength: Strength) -> None:", "        Constraint.__init__(self, strength)", "        self.v1: Variable = v1", "        self.v2: Variable = v2", "        self.direction: Direction = Direction.NONE", "        self.add_constraint()", "", "    def choose_method(self, mark: int64) -> None:", "        if self.v1.mark == mark:", "            if self.v2.mark != mark and stronger(self.strength, self.v2.walk_strength):", "                self.direction = Direction.FORWARD", "            else:", "                self.direction = Direction.BACKWARD", "", "        if self.v2.mark == mark:", "            if self.v1.mark != mark and stronger(self.strength, self.v1.walk_strength):", "                self.direction = Direction.BACKWARD", "            else:", "                self.direction = Direction.NONE", "", "        if weaker(self.v1.walk_strength, self.v2.walk_strength):", "            if stronger(self.strength, self.v1.walk_strength):", "                self.direction = Direction.BACKWARD", "            else:", "                self.direction = Direction.NONE", "        else:", "            if stronger(self.strength, self.v2.walk_strength):", "                self.direction = Direction.FORWARD", "            else:", "                self.direction = Direction.BACKWARD", "", "    def add_to_graph(self) -> None:", "        self.v1.add_constraint(self)", "        self.v2.add_constraint(self)", "        self.direction = Direction.NONE", "", "    def is_satisfied(self) -> cbool:", "        if self.direction != Direction.NONE:", "            return True", "        return False", "", "    def mark_inputs(self, mark: int64) -> None:", "        self.input().mark = mark", "", "    def input(self) -> Variable:", "        return self.v1 if self.direction == Direction.FORWARD else self.v2", "", "    def output(self) -> Variable:", "        return self.v2 if self.direction == Direction.FORWARD else self.v1", "", "    def recalculate(self) -> None:", "        ihn: Variable = self.input()", "        out: Variable = self.output()", "        out.walk_strength = weakest_of(self.strength, ihn.walk_strength)", "        out.stay = ihn.stay", "", "        if out.stay:", "            self.execute()", "", "    def mark_unsatisfied(self) -> None:", "        self.direction = Direction.NONE", "", "    def inputs_known(self, mark: int64) -> cbool:", "        i: Variable = self.input()", "        return i.mark == mark or i.stay or cbool(i.determined_by is None)", "", "    def remove_from_graph(self):", "        if self.v1 is not None:", "            self.v1.remove_constraint(self)", "", "        if self.v2 is not None:", "            self.v2.remove_constraint(self)", "", "        self.direction = Direction.NONE", "", "", "@final", "class ScaleConstraint(BinaryConstraint):", "", "    def __init__(self, src: Variable, scale: Variable, offset: Variable, dest: Variable, strength: Strength) -> None:", "        self.direction: Direction = Direction.NONE", "        self.scale: Variable = scale", "        self.offset: Variable = offset", "        BinaryConstraint.__init__(self, src, dest, strength)", "", "    def add_to_graph(self) -> None:", "        BinaryConstraint.add_to_graph(self)", "        self.scale.add_constraint(self)", "        self.offset.add_constraint(self)", "", "    def remove_from_graph(self):", "        BinaryConstraint.remove_from_graph(self)", "", "        if self.scale is not None:", "            self.scale.remove_constraint(self)", "", "        if self.offset is not None:", "            self.offset.remove_constraint(self)", "", "    def mark_inputs(self, mark: int64) -> None:", "        BinaryConstraint.mark_inputs(self, mark)", "        self.scale.mark = mark", "        self.offset.mark = mark", "", "    def execute(self) -> None:", "        if self.direction == Direction.FORWARD:", "            self.v2.value = self.v1.value * self.scale.value + self.offset.value", "        else:", "            self.v1.value = (", "                                    self.v2.value - self.offset.value) / self.scale.value", "", "    def recalculate(self) -> None:", "        ihn: Variable = self.input()", "        out: Variable = self.output()", "        out.walk_strength = weakest_of(self.strength, ihn.walk_strength)", "        out.stay = ihn.stay and self.scale.stay and self.offset.stay", "", "        if out.stay:", "            self.execute()", "", "", "@final", "class EqualityConstraint(BinaryConstraint):", "", "    def execute(self) -> None:", "        self.output().value = self.input().value", "", "", "@final", "class Variable(object):", "", "    def __init__(self, name: str, initial_value: int64 = 0) -> None:", "        self.name: str = name", "        self.value: int64 = initial_value", "        self.constraints: CheckedList[Constraint] = []", "        self.determined_by: Constraint | None = None", "        self.mark: int64 = 0", "        self.walk_strength: Strength = WEAKEST", "        self.stay: cbool = True", "", "    def add_constraint(self, constraint: Constraint) -> None:", "        self.constraints.append(constraint)", "", "    def remove_constraint(self, constraint: Constraint) -> None:", "        self.constraints.remove(constraint)", "", "        if self.determined_by == constraint:", "            self.determined_by = None", "", "", "@final", "class Planner(object):", "", "    def __init__(self) -> None:", "        self.current_mark: int64 = 0", "", "    def incremental_add(self, constraint: Constraint) -> None:", "        mark: int64 = self.new_mark()", "        overridden: Constraint | None = constraint.satisfy(mark)", "", "        while overridden is not None:", "            overridden = overridden.satisfy(mark)", "", "    def incremental_remove(self, constraint: Constraint) -> None:", "        out: Variable = constraint.output()", "        constraint.mark_unsatisfied()", "        constraint.remove_from_graph()", "        unsatisfied = self.remove_propagate_from(out)", "        strength = REQUIRED", "        # Do-while, the Python way.", "        repeat = True", "", "        while repeat:", "            for u in unsatisfied:", "                if u.strength == strength:", "                    self.incremental_add(u)", "", "                strength = strength.next_weaker()", "", "            repeat = strength != WEAKEST", "", "    def new_mark(self) -> int64:", "        x: int64 = self.current_mark + 1", "        self.current_mark = x", "        return self.current_mark", "", "    def make_plan(self, sources: CheckedList[UrnaryConstraint]) -> Plan:", "        mark: int64 = self.new_mark()", "        plan: Plan = Plan()", "        todo: CheckedList[Constraint] = [s for s in sources]", "", "        while clen(todo):", "            c: Constraint = todo.pop(0)", "", "            if c.output().mark != mark and c.inputs_known(mark):", "                plan.add_constraint(c)", "                c.output().mark = mark", "                self.add_constraints_consuming_to(c.output(), todo)", "", "        return plan", "", "    def extract_plan_from_constraints(self, constraints: CheckedList[UrnaryConstraint]) -> Plan:", "        sources: CheckedList[UrnaryConstraint] = []", "", "        for c in constraints:", "            if c.is_input() and c.is_satisfied():", "                sources.append(c)", "", "        return self.make_plan(sources)", "", "    def add_propagate(self, c: Constraint, mark: int64) -> cbool:", "        todo: CheckedList[Constraint] = []", "        todo.append(c)", "", "        while clen(todo):", "            d: Constraint = todo.pop(0)", "", "            if d.output().mark == mark:", "                self.incremental_remove(c)", "                return False", "", "            d.recalculate()", "            self.add_constraints_consuming_to(d.output(), todo)", "", "        return True", "", "    def remove_propagate_from(self, out: Variable) -> CheckedList[Constraint]:", "        out.determined_by = None", "        out.walk_strength = WEAKEST", "        out.stay = True", "        unsatisfied: CheckedList[Constraint] = []", "        todo: CheckedList[Variable] = []", "        todo.append(out)", "", "        while clen(todo):", "            v: Variable = todo.pop(0)", "", "            cs = v.constraints", "            for c in cs:", "                if not c.is_satisfied():", "                    unsatisfied.append(c)", "            determining = v.determined_by", "", "            for c in cs:", "                if c != determining and c.is_satisfied():", "                    c.recalculate()", "                    todo.append(c.output())", "", "        return unsatisfied", "", "    def add_constraints_consuming_to(self, v: Variable, coll: CheckedList[Constraint]) -> None:", "        determining = v.determined_by", "        cc = v.constraints", "", "        for c in cc:", "            if c != determining and c.is_satisfied():", "                # I guess we're just updating a reference (``coll``)? Seems", "                # inconsistent with the rest of the implementation, where they", "                # return the lists...", "                coll.append(c)", "", "", "@final", "class Plan(object):", "", "    def __init__(self) -> None:", "        self.v: CheckedList[Constraint] = []", "", "    def add_constraint(self, c: Constraint) -> None:", "        self.v.append(c)", "", "    def __len__(self):", "        return len(self.v)", "", "    def __getitem__(self, index):", "        return self.v[index]", "", "    def execute(self) -> None:", "        for c in self.v:", "            c.execute()", "", "", "# Main", "", "def recreate_planner() -> Planner:", "    global planner", "    planner = Planner()", "    return planner", "", "", "def get_planner() -> Planner:", "    global planner", "    return planner", "", "", "def chain_test(n: int64) -> None:", "    \"\"\"", "    This is the standard DeltaBlue benchmark. A long chain of equality", "    constraints is constructed with a stay constraint on one end. An", "    edit constraint is then added to the opposite end and the time is", "    measured for adding and removing this constraint, and extracting", "    and executing a constraint satisfaction plan. There are two cases.", "    In case 1, the added constraint is stronger than the stay", "    constraint and values must propagate down the entire length of the", "    chain. In case 2, the added constraint is weaker than the stay", "    constraint so it cannot be accomodated. The cost in this case is,", "    of course, very low. Typical situations lie somewhere between these", "    two extremes.", "    \"\"\"", "    planner: Planner = recreate_planner()", "    prev: Variable | None = None", "    first: Variable | None = None", "    last: Variable | None = None", "", "    # We need to go up to n inclusively.", "    i: int64 = 0", "    end: int64 = n + 1", "    while i \u003c n + 1:", "        name = \"v%s\" % box(i)", "        v: Variable = Variable(name)", "", "        if prev is not None:", "            EqualityConstraint(prev, v, REQUIRED)", "", "        if i == 0:", "            first = v", "", "        if i == n:", "            last = v", "", "        prev = v", "", "        i = i + 1", "", "    first = cast(Variable, first)", "    last = cast(Variable, last)", "", "    StayConstraint(last, STRONG_DEFAULT)", "    edit: EditConstraint = EditConstraint(first, PREFERRED)", "    edits: CheckedList[UrnaryConstraint] = []", "    edits.append(edit)", "    plan: Plan = planner.extract_plan_from_constraints(edits)", "", "    i = 0", "    while i \u003c 100:", "        first.value = i", "        plan.execute()", "", "        if last.value != i:", "            print(\"Chain test failed.\")", "", "        i = i + 1", "", "", "def projection_test(n: int64) -> None:", "    \"\"\"", "    This test constructs a two sets of variables related to each", "    other by a simple linear transformation (scale and offset). The", "    time is measured to change a variable on either side of the", "    mapping and to change the scale and offset factors.", "    \"\"\"", "    planner: Planner = recreate_planner()", "    scale: Variable = Variable(\"scale\", 10)", "    offset: Variable = Variable(\"offset\", 1000)", "    src: Variable | None = None", "", "    dests: CheckedList[Variable] = []", "", "    i: int64 = 0", "    dst = Variable(\"dst%s\" % 0, 0)", "    while i \u003c n:", "        bi: int = box(i)", "        src = Variable(\"src%s\" % bi, i)", "        dst = Variable(\"dst%s\" % bi, i)", "        dests.append(dst)", "        StayConstraint(src, NORMAL)", "        ScaleConstraint(src, scale, offset, dst, REQUIRED)", "        i = i + 1", "", "    src = cast(Variable, src)", "", "    change(src, 17)", "", "    if dst.value != 1170:", "        print(\"Projection 1 failed\")", "", "    change(dst, 1050)", "", "    if src.value != 5:", "        print(\"Projection 2 failed\")", "", "    change(scale, 5)", "", "    i = 0", "    while i \u003c n - 1:", "        if dests[i].value != (i * 5 + 1000):", "            print(\"Projection 3 failed\")", "        i = i + 1", "", "    change(offset, 2000)", "", "    i = 0", "    while i \u003c n - 1:", "        if dests[i].value != (i * 5 + 2000):", "            print(\"Projection 4 failed\")", "        i = i + 1", "", "", "def change(v: Variable, new_value: int64) -> None:", "    planner: Planner = get_planner()", "    edit: EditConstraint = EditConstraint(v, PREFERRED)", "    edits: CheckedList[UrnaryConstraint] = []", "    edits.append(edit)", "", "    plan: Plan = planner.extract_plan_from_constraints(edits)", "", "    i: int64 = 0", "    while i \u003c 10:", "        v.value = new_value", "        plan.execute()", "        i = i + 1", "", "    edit.destroy_constraint()", "", "", "# HOORAY FOR GLOBALS... Oh wait.", "# In spirit of the original, we'll keep it, but ugh.", "planner = None", "", "", "def delta_blue(i: int) -> None:", "    n: int64 = int64(i)", "    chain_test(n)", "    projection_test(n)", "", "", "if __name__ == \"__main__\":", "    n: int = 10000", "    startTime = time.time()", "    delta_blue(n)", "", "    endTime = time.time()", "    runtime = endTime - startTime", "    print(runtime)"]},source=document.querySelector('#source'),edges=document.querySelector('#edges'),cells=document.querySelector('#cells'),info=document.querySelector('#info'),NS='http://www.w3.org/2000/svg',byId=new Map(data.nodes.map(n=>[n.id,n]));

function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}function position(n){const row=document.querySelector(`.line[data-line="${n.line}"]`),body=row.querySelector('.text'),r=body.getBoundingClientRect(),style=getComputedStyle(body),probe=document.createElement('canvas').getContext('2d');probe.font=style.font;const w=probe.measureText('M').width,x1=r.left+n.col*w,x2=r.left+Math.max(n.col+1,n.endline===n.line?n.endcol:n.col+1)*w;const center=(r.top+r.bottom)/2,gap=7*(n.lane||0);return{x:(x1+x2)/2,x1,x2,y:n.slot==='type'?center+15+gap:center-15-gap}}
